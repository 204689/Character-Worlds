[project]
name = "djangocourse"
version = "0.1.0"
description = ""
authors = [
    {name = "ArmandoPaPa",email = "armands.blumbergs@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1,<7.0)",
    "django-allauth[socialaccount] (>=65.19.0,<66.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "django-widget-tweaks (>=1.5.1,<2.0.0)",
    "gunicorn (>=26.1.0,<27.0.0)",
    "whitenoise[brotli] (>=6.12.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "djangocourse"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-debug-toolbar (>=7.0.0,<8.0.0)",
    "django-browser-reload (>=1.21.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "playwright (>=1.62.0,<2.0.0)",
    "pytest-playwright (>=0.9.0,<0.10.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "djangocourse.settings"
