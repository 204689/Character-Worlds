name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Create Docker environment file
      run: |
        printf '%s\n' \
          'DEBUG=True' \
          'SECRET_KEY=ci-test-secret-key' \
          'DATABASE_URL=postgresql://ci_user:ci_password@db:5432/ci_db' \
          'POSTGRES_DB=ci_db' \
          'POSTGRES_USER=ci_user' \
          'POSTGRES_PASSWORD=ci_password' > .env.docker
    - name: Launch compose system
      run: docker compose up -d --wait
    - name: Wait for Django
      run: |
        timeout 180 docker compose exec -T web poetry run python -c '
        import socket
        import time

        deadline = time.time() + 180
        while time.time() < deadline:
            try:
                with socket.create_connection(("127.0.0.1", 8000), timeout=2):
                    break
            except OSError:
                time.sleep(2)
        else:
            raise SystemExit("Django did not start within 180 seconds")
        '
    - name: Run Playwright tests
      run: docker compose exec web poetry run pytest
    - name: Show compose logs on failure
      if: failure()
      run: docker compose logs
