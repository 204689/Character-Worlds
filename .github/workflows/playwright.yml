name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Create Docker environment file
      run: |
        printf '%s\n' \
          'DEBUG=True' \
          'SECRET_KEY=ci-test-secret-key' \
          'DATABASE_URL=postgresql://ci_user:ci_password@db:5432/ci_db' \
          'POSTGRES_DB=ci_db' \
          'POSTGRES_USER=ci_user' \
          'POSTGRES_PASSWORD=ci_password' > .env.docker
    - name: Launch compose system
      run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait
    - name: Check web container
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
        docker compose -f docker-compose.yml -f docker-compose.ci.yml logs web
    - name: Run Playwright tests
      run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec web poetry run pytest
    - name: Show compose logs on failure
      if: failure()
      run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
